<svg xmlns="http://www.w3.org/2000/svg" width="640" height="2534" viewBox="0 0 640 2534" role="img" aria-labelledby="title description">
<title id="title">M. Waleed Akhtar Awan | Full Stack Engineer</title>
<desc id="description">Full stack web development and scalable systems. Engineering at Atlas Nexus Corps. HTML, CSS, JavaScript, TypeScript, React, Next.js, Node.js, Express, MongoDB, PostgreSQL, Tailwind CSS, Git, Docker and Linux. Clean, performant and secure code. If it is not automated, it is not finished.</desc>
